[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indoor-plant-pet-advisor-api"
version = "0.0.0"
description = "Engineer 2 application API and recommendation-intelligence skeleton"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "pydantic-settings",
]

[dependency-groups]
dev = [
  "httpx",
  "mypy",
  "pytest",
  "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/advisor_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/api/src"]

