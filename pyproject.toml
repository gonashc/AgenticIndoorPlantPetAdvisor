[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indoor-plant-pet-advisor-api"
version = "0.1.0"
description = "Application API and recommendation-intelligence service"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2.0",
  "asyncpg>=0.30,<1.0",
  "cloud-sql-python-connector[asyncpg]>=1.18,<2.0",
  "fastapi",
  "langchain-core>=1.6,<2.0",
  "langchain-openai>=1.1,<2.0",
  "langgraph>=1.1,<2.0",
  "langsmith>=0.4,<1.0",
  "mcp>=2.0,<3.0",
  "pinecone>=10.0,<11.0",
  "pydantic-settings",
  "psycopg[binary]>=3.2,<4.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "uvicorn[standard]",
]

[dependency-groups]
dev = [
  "httpx",
  "mypy",
  "pytest",
  "pytest-asyncio",
  "ruff",
]

[tool.hatch.build.targets.wheel]
packages = [
  "apps/api/src/advisor_api",
  "agents",
  "database",
  "services",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "evaluation: deterministic recommendation quality and safety regression suite",
  "postgres: requires TEST_DATABASE_URL pointing to an isolated PostgreSQL database",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/api/src", "agents", "database", "evaluations", "services"]
