name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: advisor
          POSTGRES_USER: advisor
          POSTGRES_PASSWORD: advisor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U advisor -d advisor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MIGRATION_DATABASE_URL: postgresql+psycopg://advisor:advisor@127.0.0.1:5432/advisor
      TEST_DATABASE_URL: postgresql+asyncpg://advisor:advisor@127.0.0.1:5432/advisor
      UV_PYTHON: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install locked web dependencies
        run: npm ci

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Check migration-model consistency
        run: uv run alembic check

      - name: Run recommendation evaluation gate
        run: uv run pytest -m evaluation

      - name: Run unit, contract, and PostgreSQL integration tests
        run: uv run pytest -m "not evaluation"

      - name: Check generated OpenAPI contract
        shell: bash
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code -- packages/contracts/openapi/openapi.json

      - name: Check generated TypeScript API client
        shell: bash
        run: |
          npm run api-client:generate
          git diff --exit-code -- packages/api-client/src/schema.d.ts

      - name: Lint web application
        run: npm run web:lint

      - name: Type check web application
        run: npm run web:typecheck

      - name: Test web application
        run: npm run web:test

      - name: Audit production web dependencies
        run: npm audit --omit=dev

      - name: Build web application
        run: npm run web:build

      - name: Build Python package
        run: uv build

      - name: Build production container
        run: docker build --tag advisor-api:ci .

      - name: Verify migrations from production container
        run: >-
          docker run --rm --network host
          --env MIGRATION_DATABASE_URL
          advisor-api:ci
          alembic current

      - name: Smoke test production container
        shell: bash
        run: |
          container_id=$(docker run --detach --rm \
            --publish 8080:8080 \
            --env APP_ENV=test \
            --env DATABASE_MODE=memory \
            advisor-api:ci)
          trap 'docker logs "$container_id"; docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/health/ready; then
              break
            fi
            if [[ "$attempt" == "20" ]]; then
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:8080/health/live
          docker rm --force "$container_id"
          trap - EXIT
