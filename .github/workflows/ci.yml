name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: advisor
          POSTGRES_USER: advisor
          POSTGRES_PASSWORD: advisor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U advisor -d advisor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MIGRATION_DATABASE_URL: postgresql+psycopg://advisor:advisor@127.0.0.1:5432/advisor
      TEST_DATABASE_URL: postgresql+asyncpg://advisor:advisor@127.0.0.1:5432/advisor
      UV_PYTHON: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Check migration-model consistency
        run: uv run alembic check

      - name: Run unit, contract, and PostgreSQL integration tests
        run: uv run pytest

      - name: Check generated OpenAPI contract
        shell: bash
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code -- packages/contracts/openapi/openapi.json

      - name: Build Python package
        run: uv build
