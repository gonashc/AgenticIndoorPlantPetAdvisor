name: Explanation model release gate

on:
  workflow_dispatch:
    inputs:
      model:
        description: Exact OpenAI model ID to evaluate
        required: true
        default: gpt-5.6-terra
        type: string

permissions:
  contents: read

jobs:
  evaluate:
    name: explanation-release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      UV_PYTHON: "3.12"
      APP_ENV: test
      DATABASE_MODE: memory
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LANGSMITH_TRACING: "true"
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_PROJECT: IndoorPlantandPetAdvisor-release-evals
      LANGSMITH_HIDE_INPUTS: "true"
      LANGSMITH_HIDE_OUTPUTS: "true"
      EVALUATION_MODEL: ${{ inputs.model }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Run deterministic safety and ranking gate
        run: >-
          uv run python scripts/run_recommendation_evals.py
          --upload
          --experiment-prefix recommendation-v1-release-prerequisite

      - name: Run exact-model structured explanation gate
        run: >-
          uv run python scripts/run_explanation_release_evals.py
          --model "$EVALUATION_MODEL"
          --report explanation-release-report.json

      - name: Upload approval report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: explanation-release-approval-${{ github.sha }}
          path: explanation-release-report.json
          if-no-files-found: error
          retention-days: 30
